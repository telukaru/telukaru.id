<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CMS TelukAru.id - Tulis Berita</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    body{font-family:system-ui;background:#f8fafc;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
    .box{background:#fff;padding:32px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.08);text-align:center;max-width:360px}
    .logo{font-weight:700;font-size:22px;color:#0F3B82;margin-bottom:12px}
    .btn{background:#0F3B82;color:#fff;padding:12px 24px;border-radius:999px;border:none;cursor:pointer;font-weight:600;width:100%;margin-top:16px}
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">TelukAru.id CMS</div>
    <p style="color:#64748b;font-size:14px">Login dulu Prof untuk nulis berita original</p>
    <button class="btn" onclick="netlifyIdentity.open()">🔐 Login Admin</button>
    <p style="font-size:12px;color:#94a3b8;margin-top:16px">admin@telukaru.id / WA: 087794536555</p>
  </div>

<script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
<script>
  if (window.netlifyIdentity) {
    window.netlifyIdentity.on("init", user => {
      if (!user) {
        window.netlifyIdentity.on("login", () => {
          document.location.href = "/admin/";
        });
      }
    });
  }
</script>
</body>
</html>
