backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
    - name: "berita"
    label: "Berita"
    folder: "_posts"
    create: true
    fields:
            - {label: "Judul", name: "title", widget: "string"}
            - {label: "Isi", name: "body", widget: "markdown"}
